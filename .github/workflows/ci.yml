name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rounds
          POSTGRES_PASSWORD: rounds
          POSTGRES_DB: rounds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rounds" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://rounds:rounds@localhost:5432/rounds_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rounds/web exec tsx src/db/migrate.ts
      - run: pnpm typecheck
      - run: pnpm test
